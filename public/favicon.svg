<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="filmBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="10" y1="8" x2="22" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="coolFilter" x1="12" y1="8" x2="22" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Outer film chassis -->
  <rect width="32" height="32" rx="7" fill="url(#filmBg)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" stroke="#27272a" stroke-width="1.5"/>

  <!-- Film Sprocket holes (35mm) -->
  <rect x="5" y="3.5" width="3" height="2" rx="0.6" fill="#3f3f46"/>
  <rect x="11" y="3.5" width="3" height="2" rx="0.6" fill="#3f3f46"/>
  <rect x="18" y="3.5" width="3" height="2" rx="0.6" fill="#3f3f46"/>
  <rect x="24" y="3.5" width="3" height="2" rx="0.6" fill="#3f3f46"/>

  <rect x="5" y="26.5" width="3" height="2" rx="0.6" fill="#3f3f46"/>
  <rect x="11" y="26.5" width="3" height="2" rx="0.6" fill="#3f3f46"/>
  <rect x="18" y="26.5" width="3" height="2" rx="0.6" fill="#3f3f46"/>
  <rect x="24" y="26.5" width="3" height="2" rx="0.6" fill="#3f3f46"/>

  <!-- Inner 3:2 negative frame -->
  <rect x="4.5" y="7.5" width="23" height="17" rx="3" fill="#121215" stroke="#27272a" stroke-width="1"/>

  <!-- Aperture ring & chromatic light filter -->
  <circle cx="16" cy="16" r="6" stroke="url(#warmLight)" stroke-width="1.75"/>
  <path d="M16 10C19.3137 10 22 12.6863 22 16C22 19.3137 19.3137 22 16 22" stroke="url(#coolFilter)" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.5" fill="url(#warmLight)"/>
  <circle cx="18.5" cy="13.5" r="0.8" fill="#ffffff"/>
</svg>
